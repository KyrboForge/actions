name: Create release token
description: Create a short-lived token for the KyrboForge release bot

inputs:
  client-id:
    description: GitHub App client ID
    required: true
  private-key:
    description: GitHub App private key
    required: true

outputs:
  token:
    description: Short-lived GitHub App token
    value: ${{ steps.token.outputs.token }}

runs:
  using: composite
  steps:
    - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      id: token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
